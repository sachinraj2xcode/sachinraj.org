<!DOCTYPE html>
<html>
<head>
<script>
  const path = window.location.pathname.replace(/^\//, '');
  const validPages = ['projects','papers','tools','blog','contact'];
  const page = validPages.includes(path) ? path : 'home';
  sessionStorage.setItem('redirect_page', page);
  window.location.replace('/');
</script>
</head>
</html>
