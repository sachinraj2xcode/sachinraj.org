<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sachin Raj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    :root {
      --bg: #0F0F0E;
      --surface: #161614;
      --border: #252422;
      --text: #E4E0D8;
      --sub: #9A9690;
      --faint: #3C3A36;
      --amber: #C8974A;
      --amber-d: #A07838;
    }

    [data-theme="light"] {
      --bg: #F6F4EF;
      --surface: #EDEAE3;
      --border: #D4D0C8;
      --text: #1A1916;
      --sub: #6A6660;
      --faint: #C8C4BC;
      --amber: #8B5E28;
      --amber-d: #A87030;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      transition: background 0.25s, color 0.25s;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.75rem;
      z-index: 100;
      transition: background 0.25s;
    }

    #s-name {
      font-family: 'Fraunces', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 0.3rem;
      line-height: 1.25;
    }

    #s-role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--amber);
      margin-bottom: 2.5rem;
    }

    #sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    #sidebar nav a {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--sub);
      padding: 0.55rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background 0.15s, color 0.15s;
    }

    #sidebar nav a:hover {
      background: var(--border);
      color: var(--text);
    }

    #sidebar nav a.active {
      background: var(--border);
      color: var(--text);
      font-weight: 400;
    }

    .s-bottom {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* toggle */
    .toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      user-select: none;
    }

    .t-word {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      color: var(--sub);
      width: 28px;
    }

    .t-track {
      width: 34px;
      height: 18px;
      background: var(--faint);
      border-radius: 99px;
      position: relative;
      transition: background 0.2s;
    }

    .t-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      background: var(--sub);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    [data-theme="light"] .t-thumb {
      transform: translateX(16px);
      background: var(--amber);
    }

    /* socials */
    #s-socials {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    #s-socials a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.04em;
      color: var(--sub);
      text-decoration: none;
      transition: color 0.15s;
    }

    #s-socials a:hover {
      color: var(--amber);
    }

    /* ── CONTENT ── */
    #content {
      margin-left: 240px;
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 5rem 4rem;
    }

    .page {
      display: none;
      width: 100%;
      max-width: 660px;
    }

    .page.active {
      display: block;
    }

    /* ── SHARED COMPONENTS ── */
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .page-h1 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    .page-sub {
      font-size: 0.95rem;
      color: var(--sub);
      line-height: 1.75;
      margin-bottom: 2.75rem;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.05em;
      color: var(--sub);
      border: 1px solid var(--border);
      padding: 0.2rem 0.55rem;
      border-radius: 3px;
    }

    .out-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    .out-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: border-color 0.15s;
    }

    .out-link:hover {
      border-color: var(--amber);
    }

    /* ── HOME ── */
    .intro-block {
      padding-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    .intro-block p {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1.9;
      color: var(--text);
    }

    .intro-block p+p {
      margin-top: 1rem;
    }

    .intro-block a {
      color: var(--amber);
      border-bottom: 1px solid var(--amber-d);
      padding-bottom: 1px;
      transition: border-color 0.15s;
      cursor: pointer;
    }

    .intro-block a:hover {
      border-color: var(--amber);
    }

    .idx-block {
      margin-bottom: 3rem;
    }

    .idx-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.5rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: padding-left 0.18s;
    }

    .idx-row:first-of-type {
      border-top: 1px solid var(--border);
    }

    .idx-row:hover {
      padding-left: 6px;
    }

    .idx-row:hover .idx-t {
      color: var(--amber);
    }

    .idx-t {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.45;
      transition: color 0.15s;
    }

    .idx-m {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: var(--sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── PROJECTS ── */
    .entry {
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .entry:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .entry-title {
      font-family: 'Fraunces', serif;
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.3;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: var(--sub);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    .entry p {
      font-size: 0.92rem;
      color: var(--sub);
      line-height: 1.8;
      margin-bottom: 0.6rem;
    }

    .entry p:last-of-type {
      margin-bottom: 0;
    }

    /* ── PAPERS ── */
    .paper {
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .paper:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .paper-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 0.6rem;
    }

    .paper-title {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1.35;
      margin-bottom: 0.4rem;
    }

    .paper-authors {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--sub);
      margin-bottom: 0.9rem;
    }

    .paper p {
      font-size: 0.92rem;
      color: var(--sub);
      line-height: 1.8;
    }

    /* ── TOOLS ── */
    .tool {
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .tool:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tool-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .tool-ver {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: var(--sub);
      margin-bottom: 0.85rem;
    }

    .tool p {
      font-size: 0.92rem;
      color: var(--sub);
      line-height: 1.8;
      margin-bottom: 0.6rem;
    }

    .tool-commercial .tool-name {
      color: var(--amber);
    }

    /* ── BLOG ── */
    .post {
      padding: 2.25rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: padding-left 0.18s;
    }

    .post:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .post:hover {
      padding-left: 6px;
    }

    .post:hover .post-title {
      color: var(--amber);
    }

    .post-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      color: var(--sub);
      margin-bottom: 0.5rem;
    }

    .post-title {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1.35;
      margin-bottom: 0.55rem;
      transition: color 0.15s;
    }

    .post p {
      font-size: 0.9rem;
      color: var(--sub);
      line-height: 1.75;
    }

    /* ── CONTACT ── */
    .contact-note {
      font-size: 0.95rem;
      color: var(--sub);
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .c-row {
      display: flex;
      align-items: baseline;
      gap: 2rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
    }

    .c-row:first-child {
      border-top: 1px solid var(--border);
    }

    .c-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.07em;
      color: var(--sub);
      width: 80px;
      flex-shrink: 0;
    }

    .c-val {
      font-size: 0.92rem;
      color: var(--text);
    }

    .c-val a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--faint);
      padding-bottom: 1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .c-val a:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    /* contact form */
    .c-form {
      margin-top: 3rem;
    }

    .c-form-title {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: var(--sub);
      text-transform: uppercase;
    }

    .form-field input,
    .form-field textarea {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--amber);
    }

    .form-field textarea {
      min-height: 120px;
    }

    .form-submit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      background: var(--amber);
      color: var(--bg);
      border: none;
      padding: 0.7rem 1.5rem;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 0.5rem;
    }

    .form-submit:hover {
      opacity: 0.85;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 800px) {
      #app {
        flex-direction: column;
      }

      #sidebar {
        position: relative;
        width: 100%;
        height: auto;
        flex-direction: column;
        padding: 1.5rem;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      #s-role {
        margin-bottom: 1rem;
      }

      #sidebar nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.25rem;
      }

      #sidebar nav a {
        font-size: 0.8rem;
        padding: 0.35rem 0.6rem;
      }

      .s-bottom {
        flex-direction: row;
        flex-wrap: wrap;
        border-top: 1px solid var(--border);
        padding-top: 1.25rem;
      }

      #s-socials {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      #content {
        margin-left: 0;
        padding: 2.5rem 1.5rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  
/* ── BLOG STYLES ── */
.blog-loading, .blog-empty, .blog-error {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; color: var(--sub);
  padding: 2rem 0; letter-spacing: 0.05em;
}

.featured-post {
  margin-bottom: 3rem;
  padding-bottom: 3rem;
  border-bottom: 1px solid var(--border);
}

.featured-img {
  width: 100%;
  aspect-ratio: 16/7;
  overflow: hidden;
  margin-bottom: 1.5rem;
  background: var(--surface);
}
.featured-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  filter: grayscale(20%);
  transition: filter 0.3s;
}
.featured-img img:hover { filter: grayscale(0%); }

.featured-title {
  font-family: 'Fraunces', serif;
  font-size: 1.6rem; font-weight: 400;
  line-height: 1.25; margin-bottom: 0.85rem;
}

.featured-body p {
  font-size: 0.95rem; color: var(--sub);
  line-height: 1.8; margin-bottom: 1.25rem;
}

.post-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; letter-spacing: 0.07em;
  color: var(--amber); text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 1px; transition: border-color 0.15s;
}
.post-link:hover { border-color: var(--amber); }

.blog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));

  background: var(--border);
  border: 1px solid var(--border);
  margin-top: 1.25rem;
  margin-bottom: 3rem;
}

.post-card {
  background: var(--bg);
  padding: 1.5rem;
  cursor: pointer;
  transition: background 0.15s;
}
.post-card:hover { background: var(--surface); }
.post-card:hover .post-card-title { color: var(--amber); }

.post-card-title {
  font-family: 'Fraunces', serif;
  font-size: 0.98rem; font-weight: 400;
  line-height: 1.35; margin-top: 0.4rem;
  transition: color 0.15s;
}

    .papers-row::-webkit-scrollbar-thumb { background: var(--border); }

    .paper-thumb {
      width: 220px; height: 290px;
      background: #F8F7F3;

      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .paper-thumb:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.45); }

    .pt-title { font-family: Georgia, serif; font-size: 0.68rem; font-weight: 700; color: #1A1916; text-align: center; line-height: 1.3; margin-bottom: 0.3rem; }
    .pt-meta { font-family: Georgia, serif; font-size: 0.52rem; color: #5A5650; text-align: center; line-height: 1.5; font-style: italic; margin-bottom: 0.4rem; }
    .pt-section { font-family: Georgia, serif; font-size: 0.58rem; font-weight: 700; color: #1A1916; margin-top: 0.25rem; }
    .pt-body { font-family: Georgia, serif; font-size: 0.5rem; color: #3A3830; line-height: 1.6; overflow: hidden; max-height: 100px; }
    .pt-lines { margin-top: auto; border-top: 1px solid #D4D0C8; padding-top: 0.5rem; }

    .paper-read-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.06em;
      color: var(--sub); text-decoration: none;
      transition: color 0.15s;
    }
    .paper-read-link:hover { color: var(--amber); }

    
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-top: 1rem; }
    .tool-tile { background: var(--bg); padding: 1.5rem; transition: background 0.15s; }
    .tool-tile:hover { background: var(--surface); }
    .tool-tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.65rem; }
    .tool-tile-name { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 500; color: var(--amber); }
    .tool-tile-dates { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; flex-shrink: 0; }
    .tool-tile-date { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--sub); white-space: nowrap; }
    .tool-tile p { font-size: 0.85rem; color: var(--sub); line-height: 1.65; margin-bottom: 1rem; }
    .tool-tile-links { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    .tool-tile-link { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.05em; color: var(--amber); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 1px; transition: border-color 0.15s; }
    .tool-tile-link:hover { border-color: var(--amber); }

    
    #s-socials { display: flex; flex-direction: row; flex-wrap: wrap; gap: 0.75rem; }
    .social-icon-link { color: var(--sub); text-decoration: none; transition: color 0.15s; display: flex; align-items: center; }
    .social-icon-link:hover { color: var(--amber); }
    .social-icon-link svg { width: 18px; height: 18px; }

    
    #s-socials { display: flex; flex-direction: row; flex-wrap: wrap; gap: 0.85rem; margin-top: 0.25rem; }
    .social-icon-link { text-decoration: none; transition: opacity 0.15s; display: flex; align-items: center; }
    .social-icon-link:hover { opacity: 0.7; }

    
    .proj-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; transition: border-color 0.2s; }
    .proj-tile:hover { border-color: var(--amber); }
    .proj-top { display: flex; align-items: flex-start; gap: 1rem; }
    .proj-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--border); pointer-events: none; }
    .proj-meta { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; }
    .proj-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 400; line-height: 1.3; color: var(--text); }
    .proj-year { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--sub); }
    .proj-toggle { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; color: var(--amber); cursor: pointer; user-select: none; margin-top: 0.2rem; width: fit-content; }
    .proj-toggle:hover { opacity: 0.75; }
    .proj-body { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--sub); line-height: 1.8; }
    .proj-body p { margin-bottom: 0.85rem; }
    .proj-links { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .proj-link { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.05em; color: var(--amber); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 1px; transition: border-color 0.15s; }
    .proj-link:hover { border-color: var(--amber); }

    </style>
</head>

<body>
  <div id="app">

    <aside id="sidebar">
      <div>
        <div id="s-name" onclick="go('home')"></div>
        <div id="s-role"></div>
      </div>
      <nav id="s-nav"></nav>
      <div class="s-bottom">
        <div class="toggle" onclick="toggleTheme()">
          <span class="t-word" id="t-word">light</span>
          <div class="t-track">
            <div class="t-thumb"></div>
          </div>
        </div>
        <div id="s-socials"></div>
      </div>
    </aside>

    <div id="content">
      <div id="p-home" class="page active"></div>
      <div id="p-projects" class="page"></div>
      <div id="p-papers" class="page"></div>
      <div id="p-tools" class="page"></div>
      <div id="p-blog" class="page"></div>
      <div id="p-contact" class="page"></div>
    </div>

  </div>

  <script>
    const PAGES = ['home', 'projects', 'papers', 'tools', 'blog', 'contact'];
    const NAV_LABELS = { home: 'Home', projects: 'Projects', papers: 'Papers', tools: 'Tools', blog: 'Blog', contact: 'Contact' };

    let DATA = {};


    /* ── CSV PARSER ── */
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0]; // skip header row
      return lines.slice(1).map(line => {
        const cols = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { inQuotes = !inQuotes; }
          else if (ch === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
          else { current += ch; }
        }
        cols.push(current.trim());
        return cols;
      }).filter(row => row.some(c => c));
    }

    async function init(activePage) {
      const res = await fetch('/content.json');
      DATA = await res.json();
      buildSidebar();
      if (activePage) activatePage(activePage);
      buildHome();
      buildProjects();
      buildPapers();
      buildTools();
      buildBlog();  // async, handles itself
      buildContact();
    }

    /* ── SIDEBAR ── */
    function buildSidebar() {
      document.getElementById('s-name').textContent = DATA.site.name;
      document.getElementById('s-role').textContent = DATA.site.role;
      document.title = DATA.site.name;

      const nav = document.getElementById('s-nav');
      PAGES.forEach(id => {
        const a = document.createElement('a');
        a.textContent = NAV_LABELS[id];
        a.id = 'n-' + id;
        if (id === 'home') a.classList.add('active');
        a.onclick = () => go(id);
        nav.appendChild(a);
      });

      const socials = document.getElementById('s-socials');
      const SOCIAL_ICONS = {
        'LinkedIn':     '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>',
        'GitHub':       '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>',
        'YouTube':      '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="var(--bg)"/></svg>',
        'ResearchGate': '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/></svg>',
        'X / Twitter':  '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M4 4l11.733 16H20L8.267 4zM4 20l6.768-6.768M15.232 8.768L20 4"/></svg>',
      };

      const SOCIAL_COLORS = {
        'LinkedIn':     '#0A66C2',
        'YouTube':      '#FF0000',
        'GitHub':       'var(--sub)',
        'ResearchGate': '#00CCBB',
        'X / Twitter':  'var(--sub)',
      };

      DATA.socials.filter(s => s.url !== '#').forEach(s => {
        const a = document.createElement('a');
        a.href = s.url;
        a.target = '_blank';
        a.title = s.label;
        a.className = 'social-icon-link';
        a.style.color = SOCIAL_COLORS[s.label] || 'var(--sub)';
        a.innerHTML = SOCIAL_ICONS[s.label] || s.label;
        socials.appendChild(a);
      });
    }

    /* ── HOME ── */
    function buildHome() {
      const el = document.getElementById('p-home');

      // intro
      const intro = div('intro-block');
      DATA.intro.forEach((t, i) => {
        const p = document.createElement('p');
        // linkify navigation references
        p.innerHTML = t
          .replace('Papers', '<a onclick="go(\'papers\')">Papers</a>')
          .replace('Tools', '<a onclick="go(\'tools\')">Tools</a>')
          .replace('blog', '<a onclick="go(\'blog\')">blog</a>');
        intro.appendChild(p);
      });
      el.appendChild(intro);

      // projects index
      el.appendChild(buildIdx('Projects', DATA.projects.map(p => ({
        title: p.title, meta: p.year + (p.status ? ' · ' + p.status : ''), page: 'projects'
      }))));

      // papers index
      el.appendChild(buildIdx('Papers', DATA.papers.map(p => ({
        title: p.title, meta: p.status.toLowerCase(), page: 'papers'
      }))));

      // tools index
      el.appendChild(buildIdx('Tools', DATA.tools.filter(t => t.type === 'free').map(t => ({
        title: t.name + ' — ' + t.description.split('.')[0].toLowerCase(), meta: 'Python', page: 'tools'
      }))));

      // blog index
      el.appendChild(buildIdx('Latest Posts', DATA.posts.slice(0, 3).map(p => ({
        title: p.title, meta: p.date, page: 'blog'
      }))));
    }

    function buildIdx(label, rows) {
      const block = div('idx-block');
      const lbl = div('section-label'); lbl.textContent = label;
      block.appendChild(lbl);
      rows.forEach(r => {
        const row = div('idx-row');
        row.onclick = () => go(r.page);
        const t = div('idx-t'); t.textContent = r.title;
        const m = div('idx-m'); m.textContent = r.meta;
        row.appendChild(t); row.appendChild(m);
        block.appendChild(row);
      });
      return block;
    }

    /* ── PROJECTS ── */
    async function buildProjects() {
      const el = document.getElementById('p-projects');
      const h = div('page-h1'); h.textContent = 'Projects'; el.appendChild(h);
      const s = div('page-sub'); s.textContent = 'Browse all projects.'; el.appendChild(s);

      const loading = div('blog-loading'); loading.textContent = 'Loading...'; el.appendChild(loading);

      const callbackName = 'projCB_' + Date.now();
      const script = document.createElement('script');
      script.src = 'https://www.blogger.com/feeds/5275687766172546667/posts/default?alt=json-in-script&max-results=20&callback=' + callbackName;

      window[callbackName] = function(data) {
        delete window[callbackName];
        document.head.removeChild(script);
        try { el.removeChild(loading); } catch(e) {}

        const entries = ((data.feed && data.feed.entry) || []).reverse();
        if (!entries.length) {
          const empty = div('blog-loading'); empty.textContent = 'No projects yet.'; el.appendChild(empty); return;
        }

        entries.forEach(entry => {
          const tile = div('proj-tile');

          // parse raw text
          const rawHtml = entry.content ? entry.content.$t : '';
          const tmp = document.createElement('div');
          tmp.innerHTML = rawHtml;
          const fullText = tmp.textContent || '';

          // extract summary — between Summary: " and "
          const sumMatch = fullText.match(/Summary\s*:\s*["\u201c](.+?)["\u201d](?=\s*Links|\s*$)/si);
          const summaryText = sumMatch ? sumMatch[1].trim() : '';

          // extract links only from <a> hrefs — Blogger auto-converts URLs to links
          const linkUrls = Array.from(tmp.querySelectorAll('a')).map(a => a.href).filter(u =>
            u && u.startsWith('http') &&
            !u.includes('blogger.com') &&
            !u.includes('blogspot.com') &&
            !u.includes('googleusercontent.com') &&
            !u.includes('google.com')
          ).filter((u, i, arr) => arr.indexOf(u) === i);

          // thumbnail
          const imgUrl = entry.media$thumbnail
            ? entry.media$thumbnail.url.replace('/s72-c/', '/s200-c/')
            : null;

          // tile top row
          const tileTop = div('proj-top');
          if (imgUrl) {
            const thumb = document.createElement('img');
            thumb.src = imgUrl; thumb.alt = ''; thumb.className = 'proj-thumb';
            tileTop.appendChild(thumb);
          }

          const meta = div('proj-meta');
          const titleEl = div('proj-title'); titleEl.textContent = entry.title.$t; meta.appendChild(titleEl);
          const date = entry.published ? entry.published.$t : '';
          if (date) { const y = div('proj-year'); y.textContent = new Date(date).getFullYear(); meta.appendChild(y); }

          const toggle = div('proj-toggle'); toggle.textContent = 'Summary ▾'; meta.appendChild(toggle);
          tileTop.appendChild(meta);
          tile.appendChild(tileTop);

          // body
          const body = div('proj-body');
          body.style.display = 'none';
          if (summaryText) { const p = document.createElement('p'); p.textContent = summaryText; body.appendChild(p); }
          if (linkUrls.length) {
            const lrow = div('proj-links');
            linkUrls.forEach(url => {
              const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.className = 'proj-link';
              let label = 'Link';
              if (url.includes('youtube.com') || url.includes('youtu.be')) label = 'YouTube';
              else if (url.includes('github.com')) label = 'GitHub';
              else if (url.includes('arxiv.org')) label = 'arXiv';
              else if (url.includes('pypi.org')) label = 'PyPI';
              else { try { label = new URL(url).hostname.replace('www.',''); } catch(e) {} }
              a.textContent = label + ' →';
              lrow.appendChild(a);
            });
            body.appendChild(lrow);
          }

          toggle.onclick = () => {
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            toggle.textContent = open ? 'Summary ▾' : 'Summary ▴';
          };

          tile.appendChild(body);
          el.appendChild(tile);
        });
      };

      script.onerror = () => {
        try { el.removeChild(loading); } catch(e) {}
        const e = div('blog-loading'); e.textContent = 'Could not load projects.'; el.appendChild(e);
      };

      document.head.appendChild(script);
    }

    /* ── PAPERS — Google Sheets ── */
    const PAPERS_CSV = 'papers.csv';

    async function buildPapers() {
      const el = document.getElementById('p-papers');
      const h = div('page-h1'); h.textContent = 'Papers'; el.appendChild(h);
      const s = div('page-sub'); s.textContent = 'Published work links out to the journal. Abstracts here.'; el.appendChild(s);

      const loading = div('blog-loading'); loading.textContent = 'Loading...'; el.appendChild(loading);

      try {
        const rows = [
          ['test', 'test', 'test', 'https://google.com', 'test']
        ];
        el.removeChild(loading);

        if (rows.length === 0) {
          const empty = div('blog-loading'); empty.textContent = 'No papers yet.'; el.appendChild(empty); return;
        }

        const papersRow = div('papers-row');
        rows.forEach(row => {
          const [title, summary, journal, link, date] = row;
          const card = div('paper-card');

          // document thumbnail
          const thumb = div('paper-thumb');
          thumb.innerHTML = `
            <div class="pt-title">\${title || ''}</div>
            <div class="pt-meta">\${journal ? journal + '<br>' : ''}\${date || ''}</div>
            <div class="pt-section">Abstract:</div>
            <div class="pt-body">\${summary || ''}</div>
            <div class="pt-lines"></div>
          `;
          card.appendChild(thumb);

          // read link below card
          const readLink = document.createElement('a');
          readLink.className = 'paper-read-link';
          readLink.textContent = 'Read paper ...';
          readLink.href = link ? (link.startsWith('http') ? link : 'https://' + link) : '#';
          readLink.target = '_blank';
          card.appendChild(readLink);

          papersRow.appendChild(card);
        });
        el.appendChild(papersRow);
      } catch(err) {
        el.removeChild(loading);
        const e = div('blog-loading'); e.textContent = 'Could not load papers.'; el.appendChild(e);
      }
    }

    /* ── TOOLS — Google Sheets ── */
    const TOOLS_CSV = 'tools.csv';

    async function buildTools() {
      const el = document.getElementById('p-tools');
      const h = div('page-h1'); h.textContent = 'Tools'; el.appendChild(h);
      const s = div('page-sub'); s.textContent = 'All publicly available tools.'; el.appendChild(s);

      const loading = div('blog-loading'); loading.textContent = 'Loading...'; el.appendChild(loading);

      try {
        const rows = [
          ['test', 'test', 'test', 'test', 'https://google.com', 'youtube.com']
        ];
        el.removeChild(loading);

        if (rows.length === 0) {
          const empty = div('blog-loading'); empty.textContent = 'No tools yet.'; el.appendChild(empty); return;
        }

        const grid = div('tools-grid');
        rows.forEach(row => {
          const [name, summary, inception, lastUpdate, downloadLink] = row;
          const tile = div('tool-tile');

          // header row — name + dates
          const top = div('tool-tile-top');
          const nm = div('tool-tile-name'); nm.textContent = name; top.appendChild(nm);
          const dates = div('tool-tile-dates');
          if (inception)  { const i = div('tool-tile-date'); i.textContent = 'Started ' + inception; dates.appendChild(i); }
          if (lastUpdate) { const u = div('tool-tile-date'); u.textContent = 'Updated ' + lastUpdate; dates.appendChild(u); }
          if (dates.children.length) top.appendChild(dates);
          tile.appendChild(top);

          // summary
          if (summary) { const s = document.createElement('p'); s.textContent = summary; tile.appendChild(s); }

          // links row
          const lrow = div('tool-tile-links');
          if (downloadLink) {
            const a = document.createElement('a');
            a.className = 'tool-tile-link';
            a.href = downloadLink.startsWith('http') ? downloadLink : 'https://' + downloadLink;
            a.target = '_blank'; a.onclick = e => e.stopPropagation();
            a.textContent = 'Download →'; lrow.appendChild(a);
          }

          if (lrow.children.length) tile.appendChild(lrow);

          grid.appendChild(tile);
        });
        el.appendChild(grid);
      } catch(err) {
        el.removeChild(loading);
        const e = div('blog-loading'); e.textContent = 'Could not load tools.'; el.appendChild(e);
      }
    }

    /* ── BLOG — Blogger API ── */
    const BLOGGER_FEED = 'https://www.blogger.com/feeds/383089026662479161/posts/default?alt=json-in-script&max-results=20';

    function buildBlog() {
      const el = document.getElementById('p-blog');
      const h = div('page-h1'); h.textContent = 'Articles'; el.appendChild(h);
      const s = div('page-sub'); s.textContent = 'All my articles and posts.'; el.appendChild(s);

      const loading = div('blog-loading'); loading.textContent = 'Loading posts...'; el.appendChild(loading);

      // use JSONP to avoid CORS
      const callbackName = 'bloggerCallback_' + Date.now();
      const script = document.createElement('script');
      script.src = BLOGGER_FEED + '&callback=' + callbackName;

      window[callbackName] = function(data) {
        delete window[callbackName];
        document.head.removeChild(script);
        el.removeChild(loading);

        const entries = (data.feed && data.feed.entry) || [];
        if (entries.length === 0) {
          const empty = div('blog-loading'); empty.textContent = 'No posts yet — check back soon.'; el.appendChild(empty); return;
        }

        el.appendChild(buildFeaturedPost(entries[0]));

        if (entries.length > 1) {
          const lbl = div('section-label'); lbl.textContent = 'Earlier posts'; el.appendChild(lbl);
          const grid = div('blog-grid');
          entries.slice(1).forEach(e => grid.appendChild(buildPostCard(e)));
          el.appendChild(grid);
        }
      };

      script.onerror = function() {
        delete window[callbackName];
        document.head.removeChild(script);
        el.removeChild(loading);
        const e = div('blog-loading'); e.textContent = 'No posts yet — check back soon.'; el.appendChild(e);
      };

      document.head.appendChild(script);
    }

    function getPostUrl(entry) {
      const link = (entry.link || []).find(l => l.rel === 'alternate');
      return link ? link.href : '#';
    }

    function getPostImage(entry) {
      if (entry.media$thumbnail) return entry.media$thumbnail.url.replace('/s72-c/', '/s600-c/');
      const content = entry.content ? entry.content.$t : '';
      const match = content.match(/<img[^>]+src=["']([^"']+)["']/);
      return match ? match[1] : null;
    }

    function getExcerpt(entry) {
      const content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');
      const tmp = document.createElement("div"); tmp.innerHTML = content.replace(/<[^>]+>/g, " "); const text = tmp.textContent.replace(/\s+/g, " ").trim();
      return text.length > 220 ? text.slice(0, 220).trim() + '…' : text;
    }

    function formatDate(entry) {
      const raw = entry.published ? entry.published.$t : '';
      if (!raw) return '';
      return new Date(raw).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function buildFeaturedPost(entry) {
      const url = getPostUrl(entry);
      const img = getPostImage(entry);
      const wrap = div('featured-post');
      if (img) {
        const imgWrap = div('featured-img');
        const i = document.createElement('img'); i.src = img; i.alt = entry.title.$t;
        imgWrap.appendChild(i); wrap.appendChild(imgWrap);
      }
      const body = div('featured-body');
      const date = div('post-date'); date.textContent = formatDate(entry); body.appendChild(date);
      const title = div('featured-title'); title.textContent = entry.title.$t; body.appendChild(title);
      const excerpt = document.createElement('p'); excerpt.textContent = getExcerpt(entry); body.appendChild(excerpt);
      const link = document.createElement('a');
      link.className = 'post-link'; link.href = url; link.target = '_blank';
      link.textContent = 'Read on Blogger →'; body.appendChild(link);
      wrap.appendChild(body);
      return wrap;
    }

    function buildPostCard(entry) {
      const url = getPostUrl(entry);
      const card = div('post-card');
      card.onclick = () => window.open(url, '_blank');
      const date = div('post-date'); date.textContent = formatDate(entry); card.appendChild(date);
      const title = div('post-card-title'); title.textContent = entry.title.$t; card.appendChild(title);
      return card;
    }

    /* ── CONTACT ── */
    function buildContact() {
      const el = document.getElementById('p-contact');
      const h = div('page-h1'); h.textContent = 'Contact'; el.appendChild(h);
      const s = div('page-sub'); s.textContent = DATA.contact.note; el.appendChild(s);

      // socials table
      DATA.socials.filter(s => s.url !== '#').forEach(s => {
        const row = div('c-row');
        const key = div('c-key'); key.textContent = s.label.toLowerCase(); row.appendChild(key);
        const val = div('c-val');
        const a = document.createElement('a'); a.href = s.url; a.target = '_blank'; a.textContent = s.url === '#' ? 'placeholder' : s.url.replace('https://', '');
        val.appendChild(a); row.appendChild(val);
        el.appendChild(row);
      });

      // form
      const form = div('c-form');
      const ft = div('c-form-title'); ft.textContent = 'Leave a note'; form.appendChild(ft);

      const action = `https://formspree.io/f/${DATA.contact.formspree_id}`;
      const f = document.createElement('form');
      f.method = 'POST'; f.action = action;

      f.innerHTML = `
    <div class="form-grid">
      <div class="form-field">
        <label>Name</label>
        <input type="text" name="name" placeholder="Your name" required>
      </div>
      <div class="form-field">
        <label>Email</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-field">
        <label>Website <span style="opacity:.5;font-size:.9em">(optional)</span></label>
        <input type="url" name="website" placeholder="https://yoursite.com">
      </div>
      <div class="form-field full">
        <label>Comment</label>
        <textarea name="message" placeholder="What's on your mind?" required></textarea>
      </div>
    </div>
    <button type="submit" class="form-submit">Send →</button>
  `;
      form.appendChild(f);
      el.appendChild(form);
    }

    /* ── HELPERS ── */
    function div(cls) {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      return d;
    }

    function buildTags(tags) {
      const wrap = div('tags');
      tags.forEach(t => { const s = div('tag'); s.textContent = t; wrap.appendChild(s); });
      return wrap;
    }

    function buildLinks(links) {
      const wrap = div('out-links');
      links.forEach(l => {
        const a = document.createElement('a');
        a.className = 'out-link';
        a.textContent = l.label + ' →';
        a.href = l.url;
        if (l.url.startsWith('http') || l.url.startsWith('#')) {
          if (l.url.startsWith('http')) a.target = '_blank';
          if (l.url === '#contact') { a.onclick = (e) => { e.preventDefault(); go('contact'); }; }
        }
        wrap.appendChild(a);
      });
      return wrap;
    }

    /* ── NAVIGATION ── */
    function go(id) {
      if (id === 'home') { window.location.href = '/'; return; }
      window.location.href = '/' + id + '/';
    }

    function activatePage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('#s-nav a').forEach(a => a.classList.remove('active'));
      const pageEl = document.getElementById('p-' + id);
      const navEl = document.getElementById('n-' + id);
      if (pageEl) pageEl.classList.add('active');
      if (navEl) navEl.classList.add('active');
    }

    /* ── THEME ── */
    function toggleTheme() {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      document.getElementById('t-word').textContent = dark ? 'dark' : 'light';
    }

    init('projects');
    activatePage('home');
    </script>
</body>

</html>
